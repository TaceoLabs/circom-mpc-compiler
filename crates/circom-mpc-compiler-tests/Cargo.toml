[package]
name = "circom-mpc-compiler-tests"
version = "0.1.0"
edition.workspace = true
publish = false

[[test]]
name = "proving"
required-features = ["local"]

[[test]]
name = "rep3_vm"
required-features = ["local"]

[[bench]]
harness = false
name = "compile"

[[bench]]
harness = false
name = "witness_extension"
required-features = ["local"]

[dependencies]
ark-bn254.workspace = true
ark-ff.workspace = true
circom-mpc-compiler = { package = "taceo-circom-mpc-compiler", path = "../circom-mpc-compiler", version = "0.1" }
circom-mpc-program = { package = "taceo-circom-mpc-program", path = "../circom-mpc-program", version = "0.1" }
circom-mpc-vm = { package = "taceo-circom-mpc-vm", path = "../circom-mpc-vm", version = "0.1", default-features = false }
eyre.workspace = true
mpc-core.workspace = true
mpc-net.workspace = true
rand.workspace = true
serde_json.workspace = true

[dev-dependencies]
circom-types.workspace = true
co-circom-types.workspace = true
co-groth16 = { workspace = true, features = ["verifier"] }
criterion.workspace = true

[features]
default = ["local"]
local = ["circom-mpc-vm/local", "mpc-net/local"]
quic = ["circom-mpc-vm/quic", "mpc-net/quic"]
tcp = ["circom-mpc-vm/tcp", "mpc-net/tcp"]
tcp-session = ["circom-mpc-vm/tcp-session", "mpc-net/tcp-session"]
tcp-session-blocking = ["circom-mpc-vm/tcp-session-blocking", "mpc-net/tcp-session-blocking"]
tls = ["circom-mpc-vm/tls", "mpc-net/tls"]
