name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - v*
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: FULL

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - name: Install pinned Circom and JavaScript tools
        run: |
          cargo install --git https://github.com/iden3/circom \
            --rev ad44e915a12bb047b05745c2884aad9cc8326bc6 --locked --bin circom
          pnpm -C circuits install --frozen-lockfile
          echo "$PWD/circuits/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Generate mandatory small-circuit proving artifacts
        run: bash scripts/gen-proving-artifacts.sh
      - name: Confirm powers-of-tau cleanup
        run: test -z "$(find "${TMPDIR:-/tmp}" -maxdepth 1 -name 'gen-proving-artifacts.*' -print -quit)"
      - name: Unit & Integration Tests
        run: cargo test --workspace --all-features

  # Aggregator job — make this the single required check in branch protection.
  ci-success:
    name: CI success
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" \
             || "${{ needs.test.result }}" != "success" ]]; then
            echo "lint: ${{ needs.lint.result }}"
            echo "test: ${{ needs.test.result }}"
            exit 1
          fi
